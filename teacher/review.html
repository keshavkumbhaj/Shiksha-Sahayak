<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review AI Answers - Shiksha Sahayak</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/teacher.css">
</head>
<body>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo-icon">SS</div>
                <h3 style="margin:0; font-size:1.125rem;">Shiksha Sahayak</h3>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">📊 Dashboard</a>
                <a href="course.html" class="nav-item">📚 Manage Courses</a>
                <a href="materials.html" class="nav-item">📁 Upload Materials</a>
                <a href="review.html" class="nav-item active">✅ Review Content</a>
                <div style="margin-top: 2rem; border-top: 1px solid var(--border-color); padding-top: 1rem;">
                    <a href="../role-selector.html" class="nav-item" style="color: var(--danger-color);">🚪 Logout</a>
                </div>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <h2 style="margin:0; font-size:1.25rem;">Review AI-Generated Content</h2>
                <span class="badge badge-warning" id="pending-reviews-badge">Loading...</span>
            </header>

            <div class="content-wrapper">
                
                <p class="text-secondary mb-6">Approve, reject, or edit answers generated by the AI before they are published to students.</p>

                <!-- Dynamic container populated from GET /api/answers?approval_status=pending -->
                <div id="review-cards-container">
                    <div class="card text-center" style="padding: 2rem; color: var(--text-secondary);">
                        <p>Loading pending reviews from database...</p>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="../js/common.js"></script>
    <script src="../js/teacher.js"></script>
</body>
</html>
