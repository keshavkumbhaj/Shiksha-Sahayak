<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Courses - Shiksha Sahayak</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/teacher.css">
</head>
<body>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo-icon">SS</div>
                <h3 style="margin:0; font-size:1.125rem;">Shiksha Sahayak</h3>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">📊 Dashboard</a>
                <a href="course.html" class="nav-item active">📚 Manage Courses</a>
                <a href="materials.html" class="nav-item">📁 Upload Materials</a>
                <a href="review.html" class="nav-item">✅ Review Content</a>
                <div style="margin-top: 2rem; border-top: 1px solid var(--border-color); padding-top: 1rem;">
                    <a href="../role-selector.html" class="nav-item" style="color: var(--danger-color);">🚪 Logout</a>
                </div>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <h2 style="margin:0; font-size:1.25rem;">Create New Course</h2>
            </header>

            <div class="content-wrapper">
                
                <div class="card">
                    <div class="course-builder-header">
                        <div style="width: 100%; max-width: 600px;">
                            <div class="form-group">
                                <label class="form-label">Course Title</label>
                                <input type="text" id="course-title" class="form-control" placeholder="e.g., Data Structures and Algorithms" style="font-size: 1.25rem; font-weight: bold;">
                            </div>
                            <div class="form-group mb-0">
                                <label class="form-label">Course Description</label>
                                <textarea class="form-control" rows="2" placeholder="Brief description of the course..."></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="flex justify-between items-center border-bottom pb-2">
                        <h3>Course Structure</h3>
                        <button class="btn btn-primary" onclick="addUnit()">+ Add Unit</button>
                    </div>
                    
                    <div id="units-container" class="units-container">
                        <!-- Dynamic Units will be inserted here by teacher.js -->
                    </div>
                </div>

                <div class="flex" style="justify-content: flex-end; gap: 1rem; margin-top: 1rem;">
                    <button class="btn btn-secondary" onclick="window.location.href='dashboard.html'">Cancel</button>
                    <button class="btn btn-success" onclick="saveCourse()">Save Course Structure</button>
                </div>

            </div>
        </main>
    </div>

    <script src="../js/common.js"></script>
    <script src="../js/teacher.js"></script>
</body>
</html>
